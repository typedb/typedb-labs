# labs.typedb.com: one Netlify site serving every lab under its own path.
#
#   /apex/*           Project Apex (apex/web, built with VITE_BASE=/apex/)
#   /apex/api/*       its API, as an Edge Function over TypeDB Cloud (netlify/edge-functions/apex-api.ts)
#   /noodlelab/*      NoodleLab Visual Explorer (noodlelab/web, built with VITE_BASE=/noodlelab/)
#   /noodlelab/api/*  its API (netlify/edge-functions/noodlelab-api.ts)
#   /                 the index page (site/index.html)
#
# The edge functions import the TypeDB HTTP driver as an npm package, which Netlify's bundler takes from the
# root node_modules: it is a dependency of the root package.json, installed before the build. Nothing else on
# the request path uses an npm package (each lab's build-time generator parses its YAML into plain objects).
#
# Site env vars: for each lab, <PREFIX>TYPEDB_ADDRESS, <PREFIX>TYPEDB_USERNAME, <PREFIX>TYPEDB_PASSWORD and the
# database name (APEX_DATABASE, NOODLELAB_TYPEDB_DATABASE), with PREFIX = APEX_ or NOODLELAB_. A plain
# TYPEDB_ADDRESS / TYPEDB_USERNAME / TYPEDB_PASSWORD is used by any lab without its own.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The TypeDB username is "admin" in every lab's local defaults, docs and seed data; it is not a secret.
  # The password is, and stays scanned.
  SECRETS_SCAN_OMIT_KEYS = "TYPEDB_USERNAME,APEX_TYPEDB_USERNAME,NOODLELAB_TYPEDB_USERNAME"

[[edge_functions]]
  function = "apex-api"
  path = "/apex/api/*"

[[edge_functions]]
  function = "noodlelab-api"
  path = "/noodlelab/api/*"

# Each lab is a single-page app: its own paths serve its own index.
[[redirects]]
  from = "/apex"
  to = "/apex/"
  status = 301

[[redirects]]
  from = "/apex/*"
  to = "/apex/index.html"
  status = 200

[[redirects]]
  from = "/noodlelab"
  to = "/noodlelab/"
  status = 301

[[redirects]]
  from = "/noodlelab/*"
  to = "/noodlelab/index.html"
  status = 200
